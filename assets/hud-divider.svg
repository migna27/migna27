  <rect x="762" y="10" width="32" height="2" fill="#00A8FF" opacity="0.9"/>
  <rect x="778" y="16" width="26" height="2" fill="#FF2A85" opacity="0.9"/>
  <line x1="740" y1="14" x2="962" y2="14" stroke="#2979FF" stroke-width="1.5" opacity="0.4"/>
  <line x1="820" y1="14" x2="952" y2="14" stroke="#FF1744" stroke-width="2" opacity="0.9"/>

  <!-- Right HUD bracket -->
