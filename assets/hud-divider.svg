  <rect x="20" y="11" width="10" height="6" fill="#FF1744" opacity="0.9"/>
  <rect x="22" y="13" width="10" height="4" fill="#00A8FF" opacity="0.6"/>

  <!-- Left segmented neon line -->
  <line x1="38" y1="14" x2="260" y2="14" stroke="#2979FF" stroke-width="1.5" opacity="0.4"/>
  <line x1="48" y1="14" x2="180" y2="14" stroke="#00A8FF" stroke-width="2" opacity="0.9"/>
  <!-- Glitch slices left -->
  <rect x="195" y="10" width="26" height="2" fill="#FF1744" opacity="0.9"/>
