  <line x1="270" y1="14" x2="435" y2="14" stroke="#00A8FF" stroke-width="1.5" stroke-dasharray="12 6 4 6" opacity="0.85"/>

  <!-- Center diamond reticle with Red/Blue RGB offset -->
