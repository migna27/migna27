  <polygon points="502,4 512,14 502,24 492,14" stroke="#00A8FF" stroke-width="1.5" opacity="0.7"/>
  <polygon points="500,4 510,14 500,24 490,14" fill="#0B0D14" stroke="#00A8FF" stroke-width="2"/>
  <polygon points="500,9 505,14 500,19 495,14" fill="#FF2A85"/>
  <line x1="455" y1="14" x2="480" y2="14" stroke="#FF1744" stroke-width="2"/>
  <line x1="520" y1="14" x2="545" y2="14" stroke="#FF1744" stroke-width="2"/>
  <circle cx="446" cy="14" r="2" fill="#FF2A85"/>
  <circle cx="554" cy="14" r="2" fill="#00A8FF"/>

  <!-- Right segmented neon line -->
  <line x1="565" y1="14" x2="730" y2="14" stroke="#00A8FF" stroke-width="1.5" stroke-dasharray="12 6 4 6" opacity="0.85"/>
