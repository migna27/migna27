  <polygon points="16,4 380,4 392,16 392,420 380,432 16,432 4,420 4,16" stroke="#00A8FF" stroke-width="1" opacity="0.4"/>
  <polygon points="20,8 384,8 396,20 396,424 384,436 20,436 8,424 8,20" stroke="#FF2A85" stroke-width="1" opacity="0.4"/>

