<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440" fill="none">
  <defs>
    <pattern id="scanlines2" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FF2A85" opacity="0.05"/>
    </pattern>
    <pattern id="grid2" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#00A8FF" stroke-width="0.6" opacity="0.14"/>
    </pattern>
    <linearGradient id="bgGrad2" x1="400" y1="0" x2="0" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0D14"/>
      <stop offset="55%" stop-color="#101320"/>
      <stop offset="100%" stop-color="#06070B"/>
    </linearGradient>
    <linearGradient id="silGrad2" x1="200" y1="120" x2="200" y2="335" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0099FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF2A85" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Outer obsidian frame -->
  <polygon points="18,6 382,6 394,18 394,422 382,434 18,434 6,422 6,18" fill="url(#bgGrad2)" stroke="#1A1E33" stroke-width="1.5"/>
  <polygon points="18,6 382,6 394,18 394,422 382,434 18,434 6,422 6,18" fill="url(#grid2)"/>
  <polygon points="18,6 382,6 394,18 394,422 382,434 18,434 6,422 6,18" fill="url(#scanlines2)"/>

