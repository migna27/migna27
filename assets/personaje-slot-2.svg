  <rect x="116" y="344" width="168" height="24" rx="2" fill="#0B0D14" stroke="#00A8FF" stroke-width="1.2"/>
  <text x="200" y="360" text-anchor="middle" fill="#F1F5F9" font-family="Consolas, 'Fira Code', monospace" font-size="11" font-weight="bold" letter-spacing="1.2">SLOT 02 // READY</text>

