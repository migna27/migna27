  <path d="M344 6 L376 6 L388 18 L388 46" stroke="#FF1744" stroke-width="3" stroke-linecap="square"/>
  <path d="M12 394 L12 422 L24 434 L56 434" stroke="#FF2A85" stroke-width="3" stroke-linecap="square"/>
  <path d="M344 434 L376 434 L388 422 L388 394" stroke="#00A8FF" stroke-width="3" stroke-linecap="square"/>

  <!-- Top HUD Header Bar -->
