  <rect x="140" y="256" width="120" height="30" rx="2" fill="#0B0D14" fill-opacity="0.92" stroke="#FF1744" stroke-width="1"/>
  <line x1="148" y1="266" x2="220" y2="266" stroke="#00A8FF" stroke-width="2" opacity="0.85"/>
  <line x1="148" y1="276" x2="245" y2="276" stroke="#94A3B8" stroke-width="1.5" opacity="0.65"/>

