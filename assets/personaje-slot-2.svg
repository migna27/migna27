  <rect x="108" y="178" width="44" height="3" fill="#FF1744" opacity="0.8"/>
  <rect x="248" y="218" width="48" height="3" fill="#00A8FF" opacity="0.8"/>
  <rect x="118" y="298" width="40" height="2.5" fill="#FF2A85" opacity="0.85"/>
  <rect x="242" y="160" width="38" height="2.5" fill="#2979FF" opacity="0.85"/>

