  <line x1="310" y1="68" x2="378" y2="68" stroke="#00A8FF" stroke-width="2" opacity="0.85"/>
  <rect x="24" y="75" width="32" height="3" fill="#0099FF" opacity="0.8"/>
  <rect x="344" y="75" width="32" height="3" fill="#FF2A85" opacity="0.8"/>

