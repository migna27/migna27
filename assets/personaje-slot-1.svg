<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440" fill="none">
  <defs>
    <pattern id="scanlines1" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#00A8FF" opacity="0.05"/>
    </pattern>
    <pattern id="grid1" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#2979FF" stroke-width="0.6" opacity="0.16"/>
    </pattern>
    <linearGradient id="bgGrad1" x1="0" y1="0" x2="400" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0D14"/>
      <stop offset="55%" stop-color="#101320"/>
      <stop offset="100%" stop-color="#06070B"/>
    </linearGradient>
    <linearGradient id="silGrad1" x1="200" y1="120" x2="200" y2="335" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF1744" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0099FF" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- Outer obsidian frame -->
  <polygon points="18,6 382,6 394,18 394,422 382,434 18,434 6,422 6,18" fill="url(#bgGrad1)" stroke="#1A1E33" stroke-width="1.5"/>
  <polygon points="18,6 382,6 394,18 394,422 382,434 18,434 6,422 6,18" fill="url(#grid1)"/>
  <polygon points="18,6 382,6 394,18 394,422 382,434 18,434 6,422 6,18" fill="url(#scanlines1)"/>

