name: Update GitHub Telemetry

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "assets/top-langs.svg"
      - "assets/github-overview.svg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate cyberpunk HUD telemetry SVGs
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_stats.py

      - name: Commit and push updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/top-langs.svg assets/github-overview.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore(stats): actualizar telemetría de repositorios [skip ci]"
            git push
          fi
